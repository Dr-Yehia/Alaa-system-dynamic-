name: final-scientific-closure

on:
  push:
    branches:
      - "claude/lcc-q1-scientific-core"
      - "chatgpt/repository-professional-structure"
      - "chatgpt/remove-root-compat-aliases"
  pull_request:
  workflow_dispatch:

jobs:
  scientific-closure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publication runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt
      - name: Run closure suites
        run: |
          set -e
          for t in \
            tests/lcc_scientific_core_test.py \
            tests/lcc_scientific_integration_test.py \
            tests/lcc_scientific_reporting_test.py \
            tests/benefits_scientific_core_test.py \
            tests/benefits_reference_integrity_test.py \
            tests/benefits_scientific_integration_test.py \
            tests/benefits_publication_gate_test.py \
            tests/lca_scientific_core_test.py \
            tests/lca_reference_integrity_test.py \
            tests/golden_full_lca_test.py \
            tests/scientific_uncertainty_test.py \
            tests/publication_end_to_end_test.py \
            tests/scientific_publication_reporting_test.py \
            tests/publication_app_purity_test.py \
            tests/publication_app_smoke_test.py ; do
            echo "=== $t ==="
            python "$t"
          done
      - name: Compile canonical publication modules
        run: |
          python -m py_compile \
            monorail_assessment/lca/core.py \
            monorail_assessment/lca/integration.py \
            monorail_assessment/lca/reporting.py \
            monorail_assessment/lcc/core.py \
            monorail_assessment/lcc/integration.py \
            monorail_assessment/lcc/reporting.py \
            monorail_assessment/benefits/references.py \
            monorail_assessment/benefits/core.py \
            monorail_assessment/benefits/integration.py \
            monorail_assessment/benefits/reporting.py \
            monorail_assessment/publication/orchestrator.py \
            monorail_assessment/publication/reporting.py \
            monorail_assessment/publication/uncertainty.py \
            apps/publication.py

  publication-streamlit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publication runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-publication.txt
      - name: Launch publication-only Streamlit and probe health
        run: |
          set -e
          streamlit run apps/publication.py --server.headless true --server.port 8600 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8600/_stcore/health >/dev/null; then
              echo "Publication Streamlit health OK"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8600/_stcore/health
          kill $APP_PID || true
